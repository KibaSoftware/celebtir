[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/celebtir/celebtir"

[workspace.dependencies]
celebtir-core = { path = "crates/celebtir-core", version = "0.1.1" }
celebtir-registry = { path = "crates/celebtir-registry", version = "0.1.1" }
celebtir-score = { path = "crates/celebtir-score", version = "0.1.1" }
celebtir-diff = { path = "crates/celebtir-diff", version = "0.1.1" }
collect-solana = { package = "celebtir-collect-solana", path = "crates/collect-solana", version = "0.1.1" }
collect-hyperliquid = { package = "celebtir-collect-hyperliquid", path = "crates/collect-hyperliquid", version = "0.1.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", features = ["serde"] }
schemars = { version = "1.2", features = ["url2"] }
jsonschema = { version = "0.59", default-features = false }
proptest = "1.12"
tempfile = "3"
quick-xml = "0.42"
base64 = "0.23"
bs58 = "0.5"
sha2 = "0.10"
sha3 = "0.10"
curve25519-dalek = { version = "4", default-features = false }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json"] }
clap = { version = "4.6", features = ["derive", "env"] }
serde_norway = "0.9"
toml = "1.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
