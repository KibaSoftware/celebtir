# Owner programs Celebtir knows by name. An authority they control that matches no
# registry multisig resolves to Unrecognized, named here (ADR 002). Squads v4 and
# Squads v3 multisigs listed in a protocol file are decoded (COL-9, ADR 021).
programs:
  - program: SMPLecH534NA9acpos4G6x7uf3LWbCAwZQE9e8ZekMu
    name: squads-v3
    source: https://github.com/Squads-Protocol/squads-mpl
  - program: GovER5Lthms3bLBqWub97yVrMmEogzX7xNjdXpPPCVZw
    name: spl-governance
    source: https://github.com/solana-labs/solana-program-library/tree/master/governance
# HyperEVM (HREG-3, ADR 024 D3). Safe singletons are listed only once their
# code is confirmed on chain 999 (fixtures/hyperliquid/evm/safe-singletons.json).
evm:
  - address: "0x3E5c63644E683549055b9Be8653de26E0B4CD36E"
    kind: safe-singleton
    name: safe-l2-1.3.0
    source: https://github.com/safe-global/safe-deployments/blob/main/src/assets/v1.3.0/gnosis_safe_l2.json
  - address: "0xd9Db270c1B5E3Bd161E8c8503c55cEABeE709552"
    kind: safe-singleton
    name: safe-1.3.0
    source: https://github.com/safe-global/safe-deployments/blob/main/src/assets/v1.3.0/gnosis_safe.json
  - address: "0x29fcB43b46531BcA003ddC8FCB67FFE91900C762"
    kind: safe-singleton
    name: safe-l2-1.4.1
    source: https://github.com/safe-global/safe-deployments/blob/main/src/assets/v1.4.1/safe_l2.json
  - address: "0x41675C099F32341bf84BFc5382aF534df5C7461a"
