name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand on Linux to produce the pixel baselines for the visual test.
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: "Write Linux screenshots for e2e/data-states.spec.ts and upload them"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CELEBTIR_REPO_URL: https://github.com/KibaSoftware/celedir

jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deployment syntax and offline publication behavior
        run: |
          bash -n scripts/deploy/bootstrap.sh
          bash -n scripts/deploy/update.sh
          bash -n scripts/deploy/build.sh
          bash -n scripts/deploy/run.sh
          bash -n scripts/deploy/publication.sh
          bash scripts/tests/deploy_test.sh
          node --test scripts/tests/storage.test.mjs
          node --test scripts/tests/release-data.test.mjs
          node --test scripts/tests/rpc-preflight.test.mjs
          node --test scripts/tests/invariants.test.mjs
          node --test scripts/tests/nginx-api.test.mjs
          bash scripts/tests/nginx-api_test.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: release build
        run: cargo build --release --workspace
      - name: offline same-day deployment revision
        env:
          CELEBTIR_TEST_BIN: target/release/celebtir
        run: node --test scripts/tests/deploy-revision.test.mjs
      - name: scorer builds for WebAssembly (SCO-11)
        run: cargo build -p celebtir-score --target wasm32-unknown-unknown
      - name: requirement traceability
        run: bash scripts/trace.sh

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: scorer line coverage >= 90% (QA-7)
        run: cargo llvm-cov -p celebtir-score --fail-under-lines 90 --summary-only
      - name: collector line coverage >= 70% (QA-7)
        run: cargo llvm-cov -p celebtir-collect-solana --fail-under-lines 70 --summary-only

  site:
    env:
      CELEBTIR_DATA: ${{ github.workspace }}/fixtures/site-data
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/check-candidate.mjs out
      - name: one HTML file per route (UI-26)
        run: test -f out/index.html
      - name: Markdown twins, llms.txt, share cards, API files and badges were generated (UI-14, UI-15, API-1, API-4)
        run: |
          test -f out/llms.txt
          for f in out/protocols/*/index.html; do
            id=$(basename "$(dirname "$f")")
            test -f "out/protocols/$id.md" || { echo "missing out/protocols/$id.md"; exit 1; }
            test -f "out/og/$id.png" || { echo "missing out/og/$id.png"; exit 1; }
            test -f "out/data/v2/protocols/$id.json" || { echo "missing out/data/v2/protocols/$id.json"; exit 1; }
            test -f "out/badges/$id.svg" || { echo "missing out/badges/$id.svg"; exit 1; }
          done
          test -f out/data/v2/summary.json
          test ! -e out/twins
      # UI-27: under 250 KB gzip JS on Summary; graph and chart code only where used.
      - run: pnpm budget
      # QA-4: end-to-end, visual regression and axe scans, on the installed Chrome.
      - name: end-to-end tests
        if: ${{ !inputs.update_visual_baselines }}
        run: pnpm e2e
      - name: write Linux visual baselines
        if: ${{ inputs.update_visual_baselines }}
        run: pnpm e2e:update
      - name: upload Linux visual baselines
        if: ${{ inputs.update_visual_baselines }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: site/e2e/__screenshots__/linux
      - name: upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: site/playwright-report
      # UI-27 / QA-5: Lighthouse performance and accessibility 95+, LCP under 2.5 s.
      - name: Lighthouse budgets
        run: pnpm lighthouse
      - name: upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: site/.lighthouseci
